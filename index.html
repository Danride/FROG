<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111318">

<title>Коллективный текстовый квест</title>

<!-- VK Bridge -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
    :root {
        --bg: #111318;
        --text: #f2f3f5;
        --muted: #969ba5;
        --panel: #191c23;
        --panel-2: #222631;
        --border: #292e38;
        --border-2: #343a47;
        --accent: #7aa7ff;
        --accent-soft: #26385e;
        --bar-bg: #101218;
        --result-bg: #20242d;
        --next-bg: #272c37;
        --on-accent: #101218;
    }

    /* Светлая тема VK */
    body.bright {
        --bg: #f2f4f8;
        --text: #14181f;
        --muted: #6b7280;
        --panel: #ffffff;
        --panel-2: #f0f2f6;
        --border: #e1e5ec;
        --border-2: #d3d9e3;
        --accent: #3b74e8;
        --accent-soft: #dbe6ff;
        --bar-bg: #e6eaf1;
        --result-bg: #f0f3f9;
        --next-bg: #e6eaf1;
        --on-accent: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        transition: background .25s, color .25s;
    }

    .game {
        width: min(700px, 94%);

        padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }

    .header {
        text-align: center;
        margin-bottom: 25px;
    }

    .header h1 { margin-bottom: 8px; }

    .header p { color: var(--muted); }

    .user {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
        font-size: 14px;
        color: var(--muted);
    }

    .user img {
        width: 30px;
        height: 30px;
        border-radius: 50%;
    }

    .scene {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 25px;
    }

    .chapter {
        color: var(--accent);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
    }

    .story {
        font-size: 18px;
        line-height: 1.7;
        white-space: pre-line;
    }

    .question {
        margin-top: 25px;
        font-size: 20px;
        font-weight: bold;
    }

    .options {
        display: grid;
        gap: 12px;
        margin-top: 18px;
    }

    .option {
        background: var(--panel-2);
        border: 1px solid var(--border-2);
        color: var(--text);
        padding: 16px;
        border-radius: 12px;
        cursor: pointer;
        text-align: left;
        transition: .2s;
        font-family: inherit;
    }

    .option:hover {
        border-color: var(--accent);
    }

    .option.selected {
        border-color: var(--accent);
        background: var(--accent-soft);
    }

    .option-title {
        font-weight: bold;
        font-size: 16px;
    }

    .option-text {
        margin-top: 5px;
        color: var(--muted);
        font-size: 14px;
    }

    .votes { margin-top: 12px; }

    .vote-info {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 5px;
    }

    .bar {
        height: 7px;
        background: var(--bar-bg);
        border-radius: 10px;
        overflow: hidden;
    }

    .bar-fill {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width .4s;
    }

    .vote-button,
    .next-button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 15px;
        margin-top: 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        font-family: inherit;
    }

    .vote-button {
        background: var(--accent);
        color: var(--on-accent);
    }

    .next-button {
        background: var(--next-bg);
        color: var(--text);
        display: none;
    }

    .vote-button:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    .result {
        margin-top: 20px;
        padding: 15px;
        background: var(--result-bg);
        border-radius: 10px;
        display: none;
        line-height: 1.5;
    }

    .stats {
        margin-top: 15px;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
    }
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <h1>🌑 Последний сигнал</h1>

    </div>

        <button class="next-button" id="nextButton">

/* ==========================================================
   VK BRIDGE
   ========================================================== */

const bridge = window.vkBridge || null;

let vkReady = false;     // инициализация прошла успешно
let vkUser  = null;      // данные пользователя

const STORAGE_KEY = 'quest_progress_v1'; // ключ в VK Storage

/**
 * Обёртка с таймаутом: вне VK некоторые методы могут «зависнуть».
 */
function withTimeout(promise, ms = 3000) {
    return Promise.race([
        promise,
        new Promise((_, reject) =>
            setTimeout(() => reject(new Error('vk-bridge timeout')), ms)
        )
    ]);
}

/**
 * Инициализация VK Mini App.
 * Если приложение открыто в обычном браузере — просто выходим
 * и работаем на localStorage.
 */
async function initVK() {
    if (!bridge) {
        console.info('[VK] vk-bridge не загружен — обычный режим браузера');
        return;
    }

    try {
        await withTimeout(bridge.send('VKWebAppInit'));
        vkReady = true;
        console.info('[VK] VKWebAppInit OK');
    } catch (e) {
        console.warn('[VK] Не удалось инициализировать:', e.message);
        return;
    }

    // Подписка на события VK
    bridge.subscribe(handleVKEvent);

    // Тема оформления (тёмная / светлая)
    try {
        const config = await withTimeout(bridge.send('VKWebAppGetConfig'));
        if (config && config.scheme) applyScheme(config.scheme);
    } catch (e) { /* не критично */ }

    // Данные пользователя
    try {
        vkUser = await withTimeout(bridge.send('VKWebAppGetUserInfo'));
        renderUser();
    } catch (e) {
        console.warn('[VK] Не удалось получить профиль:', e.message);
    }
}

/**
 * Обработка событий от VK.
 */
function handleVKEvent(event) {
    const type = event.detail && event.detail.type;

    // VK сообщает о смене темы
    if (type === 'VKWebAppUpdateConfig') {
        applyScheme(event.detail.data.scheme);
    }
}

/**
 * Применяет тему VK к интерфейсу.
 */
function applyScheme(scheme) {
    const isLight = scheme === 'bright' || scheme === 'vkcom_light';
    document.body.classList.toggle('bright', isLight);

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = isLight ? '#f2f4f8' : '#111318';
}

/**
 * Показывает имя и аватар игрока из VK.
 */
function renderUser() {
    if (!vkUser) return;

    const el = document.getElementById('user');
    el.innerHTML = `
        <img src="${vkUser.photo_100}" alt="">
        <span>${vkUser.first_name} ${vkUser.last_name}</span>
    `;
    el.style.display = 'flex';
}

/* ---------- Хранилище (VK Storage + localStorage fallback) ---------- */

async function storageGet(key) {
    if (vkReady) {
        try {
            const res = await withTimeout(
                bridge.send('VKWebAppStorageGet', { keys: [key] })
            );
            const item = res.keys.find(k => k.key === key);
            if (item && item.value) return item.value;
        } catch (e) {
            console.warn('[VK] StorageGet error:', e.message);
        }
    }
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
}

async function storageSet(key, value) {
    if (vkReady) {
        try {
            await withTimeout(
                bridge.send('VKWebAppStorageSet', { key, value })
            );
        } catch (e) {
            console.warn('[VK] StorageSet error:', e.message);
        }
    }
    try { localStorage.setItem(key, value); } catch (e) {}
}


/* ==========================================================
   ЛОГИКА ИГРЫ
   ========================================================== */

let votes = {};          // { sceneName: [голоса по вариантам] }
let myVotes = {};        // { sceneName: выбранный индекс } — мои голоса
let currentScene = "start";
let selected = null;
let hasVoted = false;

const chapterElement  = document.getElementById("chapter");
const storyElement    = document.getElementById("story");
const questionElement = document.getElementById("question");
const optionsElement  = document.getElementById("options");
const voteButton      = document.getElementById("voteButton");
const nextButton      = document.getElementById("nextButton");
const resultElement   = document.getElementById("result");
const statsElement    = document.getElementById("stats");


function loadScene(sceneName) {

    const scene = chapters[sceneName];
    if (!scene) return;

    currentScene = sceneName;
    selected = null;
    hasVoted = false;

    chapterElement.textContent  = scene.chapter;
    storyElement.textContent    = scene.story;
    questionElement.textContent = scene.question;

    optionsElement.innerHTML = "";

    scene.options.forEach((option, index) => {

        const button = document.createElement("button");
        button.className = "option";
        button.type = "button";

        button.innerHTML = `
            <div class="option-title">${option.title}</div>
            <div class="option-text">${option.text}</div>

            <div class="votes">
                <div class="vote-info">
                    <span class="vote-count">0 голосов</span>
                    <span class="vote-percent">0%</span>
                </div>

                <div class="bar">
                    <div class="bar-fill"></div>
                </div>
            </div>
        `;

        button.addEventListener("click", () => {

            if (hasVoted) return;

            selected = index;

            document.querySelectorAll(".option")
                .forEach(el => el.classList.remove("selected"));

            button.classList.add("selected");

            voteButton.disabled = false;
        });

        optionsElement.appendChild(button);
    });

    voteButton.style.display = "block";
    voteButton.disabled = true;

    resultElement.style.display = "none";
    nextButton.style.display = "none";

    updateVotes();

    // Если пользователь уже голосовал в этой сцене — сразу показываем итог
    if (myVotes[currentScene] !== undefined) {
        showResult(myVotes[currentScene]);
    }
}


function updateVotes() {

    const sceneVotes = votes[currentScene] || [];
    const scene = chapters[currentScene];

    const total = sceneVotes.reduce((sum, value) => sum + value, 0);

    document.querySelectorAll(".option").forEach((element, index) => {

        const count = sceneVotes[index] || 0;

        const percent = total > 0
            ? Math.round(count / total * 100)
            : 0;

        element.querySelector(".vote-count")
            .textContent = `${count} голосов`;

        element.querySelector(".vote-percent")
            .textContent = `${percent}%`;

        element.querySelector(".bar-fill")
            .style.width = `${percent}%`;
    });

    statsElement.textContent = `Всего голосов: ${total}`;
}


/**
 * Показывает итог голосования и кнопку перехода дальше.
 */
function showResult(winnerIndex) {

    hasVoted = true;
    voteButton.style.display = "none";

    updateVotes();

    const optionEls = document.querySelectorAll(".option");
    optionEls.forEach(el => el.classList.remove("selected"));
    if (optionEls[winnerIndex]) optionEls[winnerIndex].classList.add("selected");

    const winningOption = chapters[currentScene].options[winnerIndex];
    if (!winningOption) return;

    resultElement.style.display = "block";
    resultElement.innerHTML = `
        🗳️ <strong>Голосование завершено.</strong><br><br>

        Сейчас лидирует:<br>
        <strong>${winningOption.title}</strong><br>
        ${winningOption.text}
    `;

    nextButton.style.display = "block";
    nextButton.onclick = () => {
        loadScene(winningOption.next);
        window.scrollTo({ top: 0, behavior: "smooth" });
    };
}


voteButton.addEventListener("click", async () => {

    if (selected === null || hasVoted) return;

    if (!votes[currentScene]) {
        votes[currentScene] =
            new Array(chapters[currentScene].options.length).fill(0);
    }

    votes[currentScene][selected]++;

    // Запоминаем выбор пользователя
    myVotes[currentScene] = selected;

    // Сохраняем в VK Storage (или localStorage вне VK)
    await storageSet(STORAGE_KEY, JSON.stringify(myVotes));

    // 🔌 Здесь можно отправить голос на свой сервер,
    //    чтобы голосование было по-настоящему общим:
    //
    // await fetch('https://your-api/vote', {
    //     method: 'POST',
    //     headers: { 'Content-Type': 'application/json' },
    //     body: JSON.stringify({
    //         scene: currentScene,
    //         option: selected,
    //         user: vkUser ? vkUser.id : null,
    //         sign: '' // подпись параметров запуска
    //     })
    // });

    const sceneVotes = votes[currentScene];

    let winner = 0;
    for (let i = 1; i < sceneVotes.length; i++) {
        if (sceneVotes[i] > sceneVotes[winner]) winner = i;
    }

    showResult(winner);
});


/**
 * Загружает сохранённый прогресс игрока.
 */
async function loadProgress() {

    const raw = await storageGet(STORAGE_KEY);
    if (!raw) return;

    try {
        myVotes = JSON.parse(raw) || {};
    } catch (e) {
        myVotes = {};
        return;
    }

    // Переносим голоса игрока в общую статистику сессии
    Object.keys(myVotes).forEach(sceneName => {

        const scene = chapters[sceneName];
        if (!scene) return;

        const index = myVotes[sceneName];
        if (index < 0 || index >= scene.options.length) return;

        if (!votes[sceneName]) {
            votes[sceneName] = new Array(scene.options.length).fill(0);
        }

        votes[sceneName][index]++;
    });
}


/* ---------- Старт ---------- */

async function start() {
    await initVK();
    await loadProgress();
    loadScene("start");
}

start();

</script>
