<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Коллективный текстовый квест</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111318;
        color: #f2f3f5;
        font-family: Arial, sans-serif;
    }

    .game {
        width: min(700px, 94%);
        margin: 30px auto;
    }

    .header {
        text-align: center;
        margin-bottom: 25px;
    }

    .header h1 {
        margin-bottom: 8px;
    }

    .header p {
        color: #969ba5;
    }

    .scene {
        background: #191c23;
        border: 1px solid #292e38;
        border-radius: 16px;
        padding: 25px;
    }

    .chapter {
        color: #7aa7ff;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
    }

    .story {
        font-size: 18px;
        line-height: 1.7;
        white-space: pre-line;
    }

    .question {
        margin-top: 25px;
        font-size: 20px;
        font-weight: bold;
    }

    .options {
        display: grid;
        gap: 12px;
        margin-top: 18px;
    }

    .option {
        background: #222631;
        border: 1px solid #343a47;
        color: white;
        padding: 16px;
        border-radius: 12px;
        cursor: pointer;
        text-align: left;
        transition: .2s;
    }

    .option:hover {
        background: #2a3040;
        border-color: #7aa7ff;
    }

    .option.selected {
        border-color: #7aa7ff;
        background: #26385e;
    }

    .option-title {
        font-weight: bold;
        font-size: 16px;
    }

    .option-text {
        margin-top: 5px;
        color: #b5bac5;
        font-size: 14px;
    }

    .votes {
        margin-top: 12px;
    }

    .vote-info {
        display: flex;
        justify-content: space-between;
        color: #aeb4bf;
        font-size: 13px;
        margin-bottom: 5px;
    }

    .bar {
        height: 7px;
        background: #101218;
        border-radius: 10px;
        overflow: hidden;
    }

    .bar-fill {
        height: 100%;
        background: #7aa7ff;
        width: 0%;
        transition: width .4s;
    }

    .vote-button,
    .next-button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 15px;
        margin-top: 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .vote-button {
        background: #7aa7ff;
        color: #101218;
    }

    .next-button {
        background: #272c37;
        color: white;
        display: none;
    }

    .vote-button:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    .result {
        margin-top: 20px;
        padding: 15px;
        background: #20242d;
        border-radius: 10px;
        display: none;
        line-height: 1.5;
    }

    .stats {
        margin-top: 15px;
        color: #858b97;
        text-align: center;
        font-size: 13px;
    }
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <h1>🌑 Последний сигнал</h1>
        <p>Коллективный текстовый квест</p>
    </div>

    <div class="scene">

        <div class="chapter" id="chapter">
            Глава 1
        </div>

        <div class="story" id="story"></div>

        <div class="question" id="question"></div>

        <div class="options" id="options"></div>

        <button class="vote-button" id="voteButton" disabled>
            Проголосовать
        </button>

        <div class="result" id="result"></div>

        <button class="next-button" id="nextButton">
            Продолжить сюжет →
        </button>

        <div class="stats" id="stats"></div>

    </div>

</div>

<script>

const chapters = {

    start: {
        chapter: "Глава 1 — Последний сигнал",

        story: `23:47.

Город погрузился во тьму.

Ты сидишь один в своей квартире, когда старый радиоприёмник внезапно включается сам.

Сначала слышен только шум.

Затем голос:

«Если ты это слышишь — не выходи на улицу».

Помехи.

«Они уже здесь».

Радио замолкает.

Через несколько секунд в дверь раздаётся три удара.

Тук.

Тук.

Тук.`,

        question: "Что должна сделать группа?",

        options: [
            {
                title: "🔦 Открыть дверь",
                text: "Узнать, кто находится снаружи.",
                next: "door"
            },
            {
                title: "📻 Проверить радио",
                text: "Попытаться восстановить сообщение.",
                next: "radio"
            },
            {
                title: "🪟 Посмотреть в окно",
                text: "Понять, что происходит на улице.",
                next: "window"
            }
        ]
    },

    door: {
        chapter: "Глава 2 — За дверью",

        story: `Ты медленно подходишь к двери.

За ней кто-то тяжело дышит.

Затем голос произносит:

«Не открывай...»

Пауза.

«...это не я».

В этот момент ручка двери начинает медленно опускаться.`,

        question: "Что делать?",

        options: [
            {
                title: "🔒 Заблокировать дверь",
                text: "Попытаться удержать неизвестного снаружи.",
                next: "lock"
            },
            {
                title: "👁 Посмотреть в глазок",
                text: "Попытаться увидеть того, кто стоит там.",
                next: "peek"
            },
            {
                title: "🏃 Уйти из квартиры",
                text: "Использовать запасной выход.",
                next: "escape"
            }
        ]
    },

    radio: {
        chapter: "Глава 2 — Частота",

        story: `Ты возвращаешься к радио.

Шум становится громче.

Ты начинаешь вращать ручку настройки.

87.4...

91.2...

102.7...

На частоте 104.3 появляется голос:

«Если вы меня слышите, у вас осталось меньше часа».

Затем передатчик сообщает координаты.`,

        question: "Что делать с координатами?",

        options: [
            {
                title: "📍 Отправиться туда",
                text: "Попытаться найти источник сигнала.",
                next: "coordinates"
            },
            {
                title: "📡 Ответить",
                text: "Попробовать связаться с неизвестным.",
                next: "answer"
            },
            {
                title: "🔇 Выключить радио",
                text: "Не рисковать и остаться дома.",
                next: "hide"
            }
        ]
    },

    window: {
        chapter: "Глава 2 — Улица",

        story: `Ты подходишь к окну.

На улице нет машин.

Нет людей.

Даже фонари погасли.

Но примерно в трёхстах метрах от дома горит один единственный свет.

И рядом с ним стоит человек.

Он смотрит прямо на твоё окно.`,

        question: "Что делать?",

        options: [
            {
                title: "🔦 Посветить ему",
                text: "Дать понять, что ты его заметил.",
                next: "light"
            },
            {
                title: "📸 Сфотографировать",
                text: "Попробовать рассмотреть его через камеру.",
                next: "photo"
            },
            {
                title: "🪟 Закрыть шторы",
                text: "Не привлекать внимания.",
                next: "curtain"
            }
        ]
    },

    lock: {
        chapter: "Глава 3",

        story: `Ты прижимаешься к двери всем телом.

Ручка перестаёт двигаться.

Несколько секунд ничего не происходит.

Затем из-за двери раздаётся знакомый голос:

«Правильно.

Не открывай».

Ты узнаёшь этот голос.

Это голос из радио.`,

        question: "Продолжение следует...",

        options: [
            {
                title: "▶ Начать заново",
                text: "Попробовать другой путь.",
                next: "start"
            }
        ]
    },

    peek: {
        chapter: "Глава 3",

        story: `Ты медленно приближаешься к глазку.

Смотришь.

На лестничной площадке никого нет.

Но напротив двери стоит зеркало.

И в зеркале отражается человек, который стоит прямо за тобой.`,

        question: "Продолжение следует...",

        options: [
            {
                title: "▶ Начать заново",
                text: "Попробовать другой путь.",
                next: "start"
            }
        ]
    },

    escape: {
        chapter: "Глава 3",

        story: `Ты выбегаешь через запасной выход.

На улице абсолютно тихо.

Телефон вибрирует.

Новое сообщение:

«Зачем вы вышли?»`,

        question: "Продолжение следует...",

        options: [
            {
                title: "▶ Начать заново",
                text: "Попробовать другой путь.",
                next: "start"
            }
        ]
    },

    coordinates: {
        chapter: "Глава 3",

        story: `Ты вводишь координаты в телефон.

Точка находится прямо под городом.

Но на карте там ничего нет.

Только старый туннель.`,

        question: "Продолжение следует...",

        options: [
            {
                title: "▶ Начать заново",
                text: "Попробовать другой путь.",
                next: "start"
            }
        ]
    },

    answer: {
        chapter: "Глава 3",

        story: `Ты нажимаешь кнопку передачи.

«Кто вы?»

Ответ приходит мгновенно:

«Мы — это вы. Через 17 минут».`,

        question: "Продолжение следует...",

        options: [
            {
                title: "▶ Начать заново",
                text: "Попробовать другой путь.",
                next: "start"
            }
        ]
    },

    hide: {
        chapter: "Глава 3",

        story: `Ты выключаешь радио.

В квартире становится абсолютно тихо.

Через несколько секунд телевизор включается сам.

На экране появляется изображение твоей комнаты.

Камера находится за твоей спиной.`,

        question: "Продолжение следует...",

        options: [
            {
                title: "▶ Начать заново",
                text: "Попробовать другой путь.",
                next: "start"
            }
        ]
    },

    light: {
        chapter: "Глава 3",

        story: `Ты включаешь фонарик.

Человек на улице поднимает руку.

И выключает свет.

Теперь во всём городе снова загораются фонари.

Но каждый из них находится рядом с человеком.`,

        question: "Продолжение следует...",

        options: [
            {
                title: "▶ Начать заново",
                text: "Попробовать другой путь.",
                next: "start"
            }
        ]
    },

    photo: {
        chapter: "Глава 3",

        story: `Ты делаешь фотографию.

На экране телефона человек исчезает.

Но появляется другое изображение.

На нём твоя квартира.

Снятая изнутри.`,

        question: "Продолжение следует...",

        options: [
            {
                title: "▶ Начать заново",
                text: "Попробовать другой путь.",
                next: "start"
            }
        ]
    },

    curtain: {
        chapter: "Глава 3",

        story: `Ты закрываешь шторы.

Через несколько секунд кто-то стучит в окно.

Ты живёшь на девятом этаже.`,

        question: "Продолжение следует...",

        options: [
            {
                title: "▶ Начать заново",
                text: "Попробовать другой путь.",
                next: "start"
            }
        ]
    }

};


// Здесь хранятся голоса текущего пользователя/демо.
// В настоящей версии эти данные должны храниться на сервере.
let votes = {};

let currentScene = "start";
let selected = null;
let hasVoted = false;

const chapterElement = document.getElementById("chapter");
const storyElement = document.getElementById("story");
const questionElement = document.getElementById("question");
const optionsElement = document.getElementById("options");
const voteButton = document.getElementById("voteButton");
const nextButton = document.getElementById("nextButton");
const resultElement = document.getElementById("result");
const statsElement = document.getElementById("stats");


function loadScene(sceneName) {

    const scene = chapters[sceneName];

    if (!scene) return;

    currentScene = sceneName;
    selected = null;
    hasVoted = false;

    chapterElement.textContent = scene.chapter;
    storyElement.textContent = scene.story;
    questionElement.textContent = scene.question;

    optionsElement.innerHTML = "";

    scene.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";
        button.type = "button";

        button.innerHTML = `
            <div class="option-title">${option.title}</div>
            <div class="option-text">${option.text}</div>

            <div class="votes">
                <div class="vote-info">
                    <span class="vote-count">0 голосов</span>
                    <span class="vote-percent">0%</span>
                </div>

                <div class="bar">
                    <div class="bar-fill"></div>
                </div>
            </div>
        `;

        button.addEventListener("click", () => {

            if (hasVoted) return;

            selected = index;

            document.querySelectorAll(".option")
                .forEach(el => el.classList.remove("selected"));

            button.classList.add("selected");

            voteButton.disabled = false;
        });

        optionsElement.appendChild(button);
    });

    voteButton.style.display = "block";
    voteButton.disabled = true;

    resultElement.style.display = "none";
    nextButton.style.display = "none";

    updateVotes();
}


function updateVotes() {

    const sceneVotes = votes[currentScene] || [];

    const scene = chapters[currentScene];

    const total = sceneVotes.reduce(
        (sum, value) => sum + value,
        0
    );

    document.querySelectorAll(".option").forEach((element, index) => {

        const count = sceneVotes[index] || 0;

        const percent = total > 0
            ? Math.round(count / total * 100)
            : 0;

        element.querySelector(".vote-count")
            .textContent = `${count} голосов`;

        element.querySelector(".vote-percent")
            .textContent = `${percent}%`;

        element.querySelector(".bar-fill")
            .style.width = `${percent}%`;
    });

    statsElement.textContent =
        `Всего голосов: ${total}`;
}


voteButton.addEventListener("click", () => {

    if (selected === null || hasVoted) return;

    if (!votes[currentScene]) {
        votes[currentScene] =
            new Array(chapters[currentScene].options.length).fill(0);
    }

    votes[currentScene][selected]++;

    hasVoted = true;

    voteButton.style.display = "none";

    updateVotes();

    const sceneVotes = votes[currentScene];

    let winner = 0;

    for (let i = 1; i < sceneVotes.length; i++) {

        if (sceneVotes[i] > sceneVotes[winner]) {
            winner = i;
        }

    }

    const winningOption =
        chapters[currentScene].options[winner];

    resultElement.style.display = "block";

    resultElement.innerHTML = `
        🗳️ <strong>Голосование завершено.</strong><br><br>

        Сейчас лидирует:<br>
        <strong>${winningOption.title}</strong><br>
        ${winningOption.text}
    `;

    nextButton.style.display = "block";

    nextButton.onclick = () => {

        loadScene(winningOption.next);

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    };

});


loadScene("start");

</script>

</body>
</html>
